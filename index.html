<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cumple feliz</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <style>
      #mainTitle {
        font-size: 32px;
        font-family: 'Pixelify Sans', sans-serif;
        margin-bottom: 8px;
      }

      #subTitle {
        font-size: 18px;
        font-family: 'Pixelify Sans', sans-serif;
        color: #555;
      }
    </style>

  </head>
  <body>
   <div class="container">
  <div id="birthdayText"></div>
  <div class="cake-container">
    <div class="cake" id="cake"></div>
  </div>
  <!-- Botón para abrir el PDF (oculto por defecto) -->
  <button id="pdfButton" style="display: none; margin-top: 20px; padding: 10px 20px; font-family: 'Pixelify Sans', sans-serif; font-size: 16px; cursor: pointer;">
    Ver carta ❤️
  </button>
</div>
    
    <script>
  const params = new URLSearchParams(window.location.search);
  const name = params.get("name") || "Amor";
  let candleCount = parseInt(params.get("candles")) || 4;
  candleCount = Math.min(Math.max(candleCount, 1), 30);

  const birthdayText = document.getElementById("birthdayText");
  birthdayText.innerHTML = `
    <div id="mainTitle">¡Feliz Cumpleaños ${name}!</div>
    <div id="subTitle">Haz un clic en el pastel fatty 😋.</div>
  `;

  const cake = document.getElementById("cake");
  const colors = ["green-candle", "purple-candle", "blue-candle", "yellow-candle"];
  const CAKE_VISUAL_WIDTH = 35;
  let blown = false;

  function createCandles(count) {
    cake.innerHTML = "";
    const CANDLE_VISUAL_WIDTH = 2;
    const availableWidth = CAKE_VISUAL_WIDTH;
    const candlesPerRow = 6;
    const shiftAmount = 4;

    for (let i = 0; i < count; i++) {
      const candle = document.createElement("div");
      candle.classList.add("candle");
      const colorClass = colors[Math.floor(Math.random() * colors.length)];
      candle.classList.add(colorClass);

      const row = Math.floor(i / candlesPerRow);
      const col = i % candlesPerRow;
      const totalCandlesInRow = Math.min(candlesPerRow, count - row * candlesPerRow);
      const rowSpacing = availableWidth / (totalCandlesInRow + 1);
      const leftBase = rowSpacing * (col + 1) - CANDLE_VISUAL_WIDTH / 2 + 5;
      const rowShift = row % 2 === 0 ? 0 : shiftAmount;

      candle.style.position = "absolute";
      candle.style.top = `${10 + row * 3}px`;
      candle.style.left = `${leftBase - rowShift + 4}px`;

      cake.appendChild(candle);
    }
  }

  createCandles(candleCount);

  // Apagar velas al hacer clic en el pastel
  cake.addEventListener("click", () => {
    if (!blown) blowOutCandles();
  });


function blowOutCandles() {
    if (blown) return;
    blown = true;
    const candles = document.querySelectorAll(".candle");

    candles.forEach((candle) => {
      const delay = Math.random() * 800;
      setTimeout(() => {
        candle.classList.add("blown");
      }, delay);
    });

    // Cambiar el texto del subtítulo
    setTimeout(() => {
      const subTitle = document.getElementById("subTitle");
      subTitle.textContent = `¡Yayy! ¡Deseándote el cumpleaños más feliz de todos! 🎉`;
      
      // Mostrar el botón del PDF
      const pdfButton = document.getElementById("pdfButton");
      if (pdfButton) {
        pdfButton.style.display = "block";
      }
    }, 1000);
  }

  // Activar micrófono tras una interacción del usuario
// Activar micrófono tras una interacción del usuario
  document.body.addEventListener("click", function initAudio() {
    startMicDetection();
    
    // Cambiar el mensaje del subtítulo al hacer clic e iniciar el micrófono
    const subTitle = document.getElementById("subTitle");
    if (subTitle && !blown) {
      subTitle.textContent = "Pide un deseo y sopla mi niña 💗";
    }

    document.body.removeEventListener("click", initAudio);
  }, { once: true });

  async function startMicDetection() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioContext.createMediaStreamSource(stream);
      const analyser = audioContext.createAnalyser();
      analyser.fftSize = 256;

      source.connect(analyser);

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      function detectBlow() {
        if (blown) return;

        analyser.getByteFrequencyData(dataArray);

        // Calcular volumen (RMS) general
        let sum = 0;
        for (let i = 0; i < bufferLength; i++) {
          sum += dataArray[i];
        }
        const average = sum / bufferLength;

        // Umbral de detección del soplido
        if (average > 45) { 
          blowOutCandles();
        } else {
          requestAnimationFrame(detectBlow);
        }
      }

      detectBlow();
    } catch (err) {
      console.warn("No se pudo acceder al micrófono:", err);
    }
  }

  // Acción al hacer clic en el botón del PDF
  document.getElementById("pdfButton").addEventListener("click", () => {
    const pdfUrl = 'carta.pdf'; // Cambia por tu archivo o enlace
    const anchor = document.createElement('a');
    anchor.href = pdfUrl;
    anchor.target = '_blank';
    document.body.appendChild(anchor);
    anchor.click();
    document.body.removeChild(anchor);
  });
</script>
  </body>
</html>
